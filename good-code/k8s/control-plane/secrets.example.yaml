# EXAMPLE secrets — copy to secrets.yaml, fill in real values, and DO NOT commit
# the filled copy (secrets.yaml is gitignored). Apply with:
#   kubectl apply -f secrets.yaml
#
# Generate the shared secrets once, e.g.:
#   openssl rand -hex 32   # JWT_SECRET / WORKSPACE_TOKEN_SECRET / INTERNAL_TOKEN
#
# Three secrets, by consumer:
#   peppl-control    -> init-service + orchestrator (control plane)
#   peppl-workspace  -> the per-repl workspace pods (referenced by service.yaml)
#   peppl-internal   -> the reaper CronJob (machine-to-machine sweep)
# JWT_SECRET, WORKSPACE_TOKEN_SECRET and the internal token must be IDENTICAL
# across the secrets that share them (noted inline).
apiVersion: v1
kind: Secret
metadata:
  name: peppl-control
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://USER:PASS@cluster.example.mongodb.net"
  JWT_SECRET: "REPLACE_ME_shared_with_orchestrator"          # init + orchestrator must match
  GOOGLE_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  INTERNAL_TOKEN: "REPLACE_ME_shared_internal_token"          # == peppl-internal/internal-token, == peppl-workspace/INTERNAL_TOKEN
  WORKSPACE_TOKEN_SECRET: "REPLACE_ME_shared_workspace_secret" # == peppl-workspace/WORKSPACE_TOKEN_SECRET
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com"   # only for non-AWS S3 (MinIO/LocalStack)
---
apiVersion: v1
kind: Secret
metadata:
  name: peppl-workspace
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  WORKSPACE_TOKEN_SECRET: "REPLACE_ME_shared_workspace_secret" # == peppl-control/WORKSPACE_TOKEN_SECRET
  INTERNAL_TOKEN: "REPLACE_ME_shared_internal_token"           # == peppl-control/INTERNAL_TOKEN
  # S3_ENDPOINT: "https://minio.example.com"   # only for non-AWS S3; optional
---
apiVersion: v1
kind: Secret
metadata:
  name: peppl-internal
type: Opaque
stringData:
  internal-token: "REPLACE_ME_shared_internal_token"           # == peppl-control/INTERNAL_TOKEN
