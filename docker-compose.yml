# Local dev plane for Peppl's control-plane data path: MongoDB + an
# S3-compatible store (MinIO) + init-service. This brings up everything the
# create-workspace flow needs WITHOUT a Kubernetes cluster.
#
#   docker compose up --build
#
# What this does NOT run: orchestrator-simple and the runner pods need a real
# Kubernetes cluster (kind/minikube) — see the README. Run the frontend with
# `npm run dev` in good-code/frontend, pointed at http://localhost:3001.
#
# Before first use, seed the workspace templates into the bucket, e.g.:
#   aws --endpoint-url http://localhost:9000 s3 cp ./templates/node-js \
#       s3://repl/base/node-js/ --recursive   (creds: minioadmin/minioadmin)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the bucket init-service copies templates within.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/repl &&
      echo 'bucket repl ready'
      "

  init-service:
    build: ./good-code/init-service
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: repl
      S3_BUCKET: repl
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Fill these in via a .env file next to this compose file (or export them):
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      MAX_REPLS_PER_USER: ${MAX_REPLS_PER_USER:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  mongo-data:
  minio-data:
