name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each service is an independent Node/TS project under good-code/ with its own
# package.json — there is no root workspace tooling — so CI fans out per service.
jobs:
  backend:
    name: ${{ matrix.service }} (build + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [init-service, orchestrator-simple, runner]
    defaults:
      run:
        working-directory: good-code/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: good-code/${{ matrix.service }}/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: good-code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: good-code/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
